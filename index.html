<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1C Query AI Board — клиент → модель → MCP → BSL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .code-block { font-family: Consolas, "Courier New", monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">1C Query AI Board</h1>
            <p class="text-xs text-slate-400">запрос клиента → модель → MCP → BSL</p>
        </div>
        <div class="text-sm text-slate-300" id="status-line">проверка статуса...</div>
    </header>
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
        <div class="lg:col-span-4">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <h2 class="font-semibold mb-3">Ход схемы</h2>
                <div id="mcp-logs" class="bg-slate-950 border border-slate-800 rounded p-3 font-mono text-xs text-slate-400 max-h-[32rem] overflow-y-auto">
                    <div>Ожидание запроса клиента.</div>
                </div>
                <h3 class="font-semibold mt-4 mb-2 text-sm">Журнал файла</h3>
                <div id="file-log" class="bg-slate-950 border border-slate-800 rounded p-3 font-mono text-xs text-slate-500 max-h-40 overflow-y-auto">пусто</div>
            </div>
        </div>
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
                <h2 class="font-semibold">Запрос клиента</h2>
                <textarea id="prompt-input" rows="3" placeholder="Например: остатки товаров на складах за период" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm"></textarea>
                <div id="choices" class="flex flex-wrap gap-2"></div>
                <div class="flex gap-2">
                    <button onclick="generateQuery()" id="btn-generate" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-lg text-sm">Сгенерировать BSL</button>
                    <button onclick="newDialog()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2 rounded-lg text-sm">Новый диалог</button>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
                <div class="flex justify-between">
                    <h2 class="font-semibold">BSL после MCP</h2>
                    <button onclick="copyQuery()" class="text-xs bg-slate-700 px-3 py-1.5 rounded">Копировать</button>
                </div>
                <pre class="code-block text-xs text-emerald-300 whitespace-pre-wrap bg-slate-950 border border-slate-800 rounded-lg p-4" id="code-output">// Нажмите «Сгенерировать BSL»</pre>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div class="bg-slate-900 p-3 rounded border border-slate-700" id="params-output">Параметры: -</div>
                    <div class="bg-slate-900 p-3 rounded border border-slate-700" id="arch-output">Архитектура: -</div>
                    <div class="bg-slate-900 p-3 rounded border border-slate-700" id="usage-output">Токены запроса: -</div>
                    <div class="bg-slate-900 p-3 rounded border border-slate-700" id="usage-total">Токены сессии: 0</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function refreshStatus() {
            const res = await fetch("/status");
            const data = await res.json();
            const key = data.api_key_configured ? "ключ задан" : "ключ не задан";
            document.getElementById("status-line").textContent =
                data.schema + " · " + data.model + " · " + key + " · метаданные " + (data.metadata_loaded ? "загружены" : "пусты");
        }
        refreshStatus().catch(() => {});

        function addLog(msg, colorClass) {
            const logBox = document.getElementById("mcp-logs");
            const entry = document.createElement("div");
            entry.className = colorClass || "text-slate-400";
            entry.textContent = msg;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function copyQuery() {
            navigator.clipboard.writeText(document.getElementById("code-output").textContent);
        }

        const dialog = [];
        const sessionUsage = {calls: 0, prompt_tokens: 0, completion_tokens: 0, total_tokens: 0};

        function showUsage(usage) {
            const current = usage || {};
            document.getElementById("usage-output").textContent =
                "Токены запроса: " + (current.total_tokens || 0)
                + " (вход " + (current.prompt_tokens || 0)
                + ", выход " + (current.completion_tokens || 0)
                + ", вызовов " + (current.calls || 0) + ")";
            sessionUsage.calls += current.calls || 0;
            sessionUsage.prompt_tokens += current.prompt_tokens || 0;
            sessionUsage.completion_tokens += current.completion_tokens || 0;
            sessionUsage.total_tokens += current.total_tokens || 0;
            document.getElementById("usage-total").textContent =
                "Токены сессии: " + sessionUsage.total_tokens
                + " (вход " + sessionUsage.prompt_tokens
                + ", выход " + sessionUsage.completion_tokens
                + ", вызовов " + sessionUsage.calls + ")";
            addLog("[токены] " + (current.total_tokens || 0) + " за запрос, " + sessionUsage.total_tokens + " за сессию", "text-slate-300");
        }

        function choose(text) {
            document.getElementById("prompt-input").value = text;
            generateQuery();
        }

        function showChoices(data) {
            const box = document.getElementById("choices");
            box.innerHTML = "";
            if (data.status !== "need_clarification") return;
            (data.candidates || []).forEach((item) => {
                const button = document.createElement("button");
                button.className = "bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs";
                button.textContent = item.object || item.query_name || "вариант";
                button.onclick = () => choose(item.object || "");
                box.appendChild(button);
            });
        }

        async function refreshFileLog() {
            const res = await fetch("/log");
            const data = await res.json();
            const lines = (data.lines || []).map((item) => item.time + " " + item.status + " " + ((item.usage || {}).total_tokens || 0) + " " + item.prompt);
            document.getElementById("file-log").textContent = lines.join("\n") || "пусто";
        }

        function newDialog() {
            dialog.length = 0;
            document.getElementById("choices").innerHTML = "";
            document.getElementById("prompt-input").value = "";
            document.getElementById("mcp-logs").innerHTML = "<div>Новый диалог. Ожидание запроса клиента.</div>";
            document.getElementById("code-output").textContent = "// здесь появится текст запроса";
            document.getElementById("params-output").textContent = "Параметры: -";
            document.getElementById("arch-output").textContent = "Архитектура: -";
        }

        async function generateQuery() {
            const prompt = document.getElementById("prompt-input").value.trim();
            if (!prompt) return;
            const btn = document.getElementById("btn-generate");
            btn.disabled = true;
            addLog("[клиент] " + prompt, "text-amber-300");
            addLog("[модель] запрос ушёл в модель, MCP ещё не вызывался", "text-slate-300");
            try {
                const res = await fetch("/generate", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({prompt, history: dialog})
                });
                const data = await res.json();
                dialog.push({role: "клиент", content: prompt});
                if (data.architecture_comment) dialog.push({role: "доска", content: data.architecture_comment});
                (data.trace || []).forEach((step) => {
                    if (step.tool === "require_mcp") {
                        addLog("[хост] " + (step.preview || "нужна карточка MCP"), "text-red-400");
                        return;
                    }
                    addLog("[модель → MCP] " + step.tool + " " + JSON.stringify(step.arguments || {}), "text-blue-300");
                    addLog("[MCP] " + step.status + " · " + step.preview, "text-emerald-300");
                });
                document.getElementById("code-output").textContent = data.bsl_code || "// пусто";
                document.getElementById("params-output").textContent = "Параметры: " + ((data.parameters || []).join(", ") || "-");
                document.getElementById("arch-output").textContent = "Архитектура: " + (data.architecture_comment || "-");
                showUsage(data.usage);
                showChoices(data);
                refreshFileLog().catch(() => {});
                addLog(data.status === "success" ? "[модель] BSL после MCP" : (data.status === "need_clarification" ? "[уточнение] " + (data.architecture_comment || "") : "[ошибка] BSL не принят"), data.status === "success" ? "text-emerald-400" : "text-red-400");
            } catch (err) {
                addLog("[сеть] " + err.message, "text-red-400");
            } finally {
                document.getElementById("prompt-input").value = "";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
